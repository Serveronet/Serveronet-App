      description: 'Endpoint to query local or peer database'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  success: true
                  data:
                    -
                      body: 'Post body'
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    example:
                      -
                        body: 'Post body'
                    items:
                      type: object
                      properties:
                        body:
                          type: string
                          example: 'Post body'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query_parameters:
                  type: json
                  description: ''
                  example: 'Json body of query parameters - {"table":"posts","where":[["title","!=","excluded_title"]]}'
